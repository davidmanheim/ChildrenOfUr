services:
  postgres:
    image: postgres:14-alpine
    environment:
      POSTGRES_DB: cou
      POSTGRES_USER: cou
      POSTGRES_PASSWORD: cou
    command: ["postgres", "-c", "hba_file=/etc/postgresql/pg_hba.local.conf"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cou -d cou"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "5432:5432"
    volumes:
      - cou-postgres:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
      - ./docker/postgres/pg_hba.local.conf:/etc/postgresql/pg_hba.local.conf:ro

  game-server:
    build:
      context: .
      dockerfile: docker/coUserver.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /app
    command: ["sh", "-c", "pub get && dart declarations.dart --no-load-cert"]
    # Local-only convenience: give a new local player an actual starting quest.
    environment:
      LOCAL_SEED_QUESTS: "true"
    ports:
      - "8181:8181"
      - "8282:8282"
    volumes:
      - ./coUserver:/app

  auth-server:
    build:
      context: .
      dockerfile: docker/authServer.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /app
    command: ["sh", "-c", "pub get && dart bin/authserver.dart --no-load-cert"]
    ports:
      - "8383:8383"
      - "8484:8484"
    volumes:
      - ./authServer:/app

  client:
    build:
      context: .
      dockerfile: docker/client.Dockerfile
    depends_on:
      - game-server
      - auth-server
    working_dir: /app
    command: ["sh", "-c", "pub get && pub run build_runner serve --delete-conflicting-outputs --hostname 0.0.0.0 web:8080"]
    ports:
      - "8080:8080"
    volumes:
      - ./coUclient:/app

volumes:
  cou-postgres:
